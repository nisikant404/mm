{% extends "base.html" %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-slate-900 flex flex-col p-8">
    <div class="flex-1 grid md:grid-cols-2 gap-8 items-center justify-center max-w-7xl mx-auto w-full">
        
        <div class="relative group aspect-video bg-slate-800 rounded-[3rem] overflow-hidden border-2 border-slate-700 shadow-2xl">
            <video id="my-video" playsinline muted autoplay class="w-full h-full object-cover"></video>
            <div class="absolute bottom-8 left-8 flex items-center gap-3 bg-black/40 backdrop-blur-xl px-6 py-3 rounded-2xl text-white text-xs font-black uppercase tracking-widest border border-white/10">
                <i data-lucide="user" class="w-4 h-4 text-blue-400"></i> You (Local)
            </div>
        </div>

        
        <div class="relative group aspect-video bg-slate-800 rounded-[3rem] overflow-hidden border-2 border-slate-700 shadow-2xl">
            <video id="user-video" playsinline autoplay class="w-full h-full object-cover"></video>
            <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-6">
                <div class="w-24 h-24 bg-slate-700 rounded-[2rem] flex items-center justify-center animate-pulse">
                    <i data-lucide="video-off" class="w-10 h-10"></i>
                </div>
                <p class="font-black text-xs uppercase tracking-[0.2em] text-slate-400">Waiting for connection...</p>
            </div>
            <div class="absolute bottom-8 left-8 flex items-center gap-3 bg-black/40 backdrop-blur-xl px-6 py-3 rounded-2xl text-white text-xs font-black uppercase tracking-widest border border-white/10">
                <i data-lucide="video" class="w-4 h-4 text-emerald-400"></i> Remote Consultation
            </div>
        </div>
    </div>

    
    <div class="mt-12 flex items-center justify-center gap-8">
        <button class="p-6 bg-slate-800 text-white rounded-[2rem] hover:bg-slate-700 transition-all border border-slate-700 shadow-xl group">
            <i data-lucide="mic" class="w-7 h-7 group-hover:scale-110 transition-transform"></i>
        </button>
        <button id="call-btn" class="px-12 py-6 bg-blue-600 text-white rounded-[2rem] font-black text-lg hover:bg-blue-700 shadow-2xl shadow-blue-500/30 transition-all active:scale-95">
            Start Video Session
        </button>
        <button id="answer-btn" class="hidden px-12 py-6 bg-emerald-600 text-white rounded-[2rem] font-black text-lg hover:bg-emerald-700 shadow-2xl shadow-emerald-500/30 transition-all animate-bounce">
            Accept Consultation
        </button>
        <button id="hangup-btn" class="p-6 bg-red-600 text-white rounded-[2rem] hover:bg-red-700 transition-all shadow-xl shadow-red-900/30 group">
            <i data-lucide="phone-off" class="w-7 h-7 group-hover:scale-110 transition-transform"></i>
        </button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
<script>
    const socket = io();
    const currentUserId = {{ current_user.id }};
    const targetUserId = {{ target_user.id }};
    let myStream;
    let peer;

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            myStream = stream;
            document.getElementById('my-video').srcObject = stream;
        });

    document.getElementById('call-btn').addEventListener('click', () => {
        if (!myStream) return alert('Camera/Microphone access required');
        peer = new SimplePeer({ initiator: true, trickle: false, stream: myStream });
        setupPeerEvents(peer);
        document.getElementById('call-btn').innerText = 'Calling...';
        document.getElementById('call-btn').disabled = true;
    });

    socket.on('call_incoming', (data) => {
        if (data.from == targetUserId) {
            document.getElementById('call-btn').classList.add('hidden');
            document.getElementById('answer-btn').classList.remove('hidden');
            
            document.getElementById('answer-btn').onclick = () => {
                peer = new SimplePeer({ initiator: false, trickle: false, stream: myStream });
                setupPeerEvents(peer);
                peer.signal(data.signal);
                document.getElementById('answer-btn').classList.add('hidden');
            };
        }
    });

    socket.on('call_accepted', signal => {
        if (peer && peer.initiator) {
            peer.signal(signal);
            document.getElementById('call-btn').innerText = 'Connected';
        }
    });

    function setupPeerEvents(p) {
        p.on('signal', data => {
            if (p.initiator) {
                socket.emit('call_user', {
                    userToCall: targetUserId.toString(),
                    signalData: data,
                    from: currentUserId
                });
            } else {
                socket.emit('answer_call', { signal: data, to: targetUserId.toString() });
            }
        });

        p.on('stream', stream => {
            const userVideo = document.getElementById('user-video');
            userVideo.srcObject = stream;
            document.getElementById('video-placeholder').classList.add('hidden');
        });

        p.on('error', err => console.error('Peer error:', err));
        p.on('close', () => window.location.reload());
    }

    // Join room for SocketIO signaling
    socket.emit('join_room', { room: currentUserId.toString() });

    document.getElementById('hangup-btn').onclick = () => {
        if (peer) peer.destroy();
        window.location.href = "{{ url_for('consultation.chat', user_id=target_user.id) }}";
    };
</script>
{% endblock %}
